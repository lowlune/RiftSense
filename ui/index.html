<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoL Coach</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2/src/fill/style.css">
<style>
  :root {
    --bg: #05090F;
    --panel: #0C1420;
    --panel2: #101A2C;
    --line: rgba(200,170,110,.22);
    --gold: #C8AA6E;
    --gold-dim: #8A7448;
    --text: #EAE4D4;
    --dim: #7E8998;
    --faint: #3c4450;
    --blue: #4D9DE0;
    --red: #E05D6F;
    --green: #4FCB7C;
    --amber: #E8B44A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #0D1930 0%, var(--bg) 60%);
    color: var(--text);
    font: 13.5px/1.45 "Segoe UI", "Inter", system-ui, sans-serif;
    padding: 8px 12px 9px;
    overflow: hidden;
  }
  .shell { height: 100%; max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; gap: 7px; min-height: 0; }
  i[class^="ph"], i[class*=" ph"] { line-height: 1; display: inline-block; }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-thumb { background: rgba(200,170,110,.22); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .topbar { flex: 0 0 auto; display: flex; align-items: center; flex-wrap: wrap; row-gap: 4px; gap: 15px; padding: 1px 6px 6px; border-bottom: 1px solid rgba(255,255,255,.07); }
  .topbar > * { min-width: 0; }
  #clock { font: 700 20px/1 "Cascadia Mono", Consolas, monospace; color: #fff; text-shadow: 0 0 14px rgba(77,157,224,.35); }
  #clock.stale { color: var(--amber); text-shadow: none; }
  .livepill { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
  .livepill .st-live { color: var(--green); animation: pulse 2s infinite; }
  .livepill .st-wait { color: var(--amber); }
  .livepill .st-dead { color: var(--red); }
  .obj { display: flex; align-items: center; gap: 5px; }
  .obj i { font-size: 14px; color: var(--dim); }
  .obj .lab { font-size: 8.5px; font-weight: 700; letter-spacing: .14em; color: var(--dim); }
  .obj .val { font: 600 12.5px/1 "Cascadia Mono", Consolas, monospace; }
  .obj.up .val, .obj.up i { color: var(--green); }
  .obj.soon .val, .obj.soon i { color: var(--amber); animation: pulse 1.4s infinite; }
  .obj.gold i { color: var(--gold); }
  .tspacer { flex: 1 1 auto; }
  #summoner { font-size: 12px; color: var(--text); max-width: 32vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hcost { display: flex; align-items: baseline; gap: 6px; }
  .hcost .amount { font: 700 14.5px/1 "Cascadia Mono", Consolas, monospace; color: var(--gold); }
  .hcost .sub { font-size: 9.5px; color: var(--dim); }
  .audiostate { font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .audiostate.on { color: var(--green); }
  .audiostate.blocked { color: var(--amber); }
  .audiostate.tap { color: var(--dim); }
  .audiostate.off { color: var(--faint); }
  .diag { display: none; font-size: 9.5px; color: var(--amber); white-space: nowrap; }
  .diag.show { display: inline; }
  .mutebtn { background: transparent; border: 1px solid rgba(255,255,255,.08); color: var(--dim); border-radius: 7px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; }
  .mutebtn:hover { color: var(--gold); border-color: var(--line); }
  .mutebtn.off { color: var(--faint); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }

  .buildstrip { flex: 0 0 auto; display: flex; align-items: center; flex-wrap: wrap; row-gap: 4px; gap: 10px; padding: 0 6px; }
  .buildstrip .blabel { display: flex; align-items: center; gap: 5px; font-size: 9px; font-weight: 700; letter-spacing: .2em; color: var(--gold-dim); }
  .buildstrip .blabel i { font-size: 12px; }
  .berr { font-size: 9.5px; color: var(--red); }
  .bitems { display: flex; align-items: center; gap: 4px; overflow-x: auto; overflow-y: hidden; min-width: 0; flex: 1 1 auto; }
  .bitem { position: relative; flex: 0 0 auto; }
  .bitem img { width: 23px; height: 23px; border-radius: 5px; border: 1px solid rgba(255,255,255,.10); background: #0a1220; display: block; }
  .bitem.owned img { opacity: .45; }
  .bitem.next img { border-color: var(--gold); box-shadow: 0 0 8px rgba(200,170,110,.4); }
  .bitem.cur img { border-color: rgba(255,255,255,.18); }
  .bitem.todo img { opacity: .45; }
  .bcomplete { font-size: 9.5px; color: var(--green); letter-spacing: .08em; }
  .bitem .chk { position: absolute; right: -3px; bottom: -3px; background: var(--green); color: #06210f; border-radius: 50%; width: 12px; height: 12px; font-size: 8px; display: flex; align-items: center; justify-content: center; }
  .barrow { color: var(--faint); font-size: 11px; }
  .bpurchase { display: flex; align-items: center; gap: 6px; font-size: 9.5px; color: var(--dim); white-space: nowrap; }
  .bpurchase .gnext { font: 700 10.5px/1 "Cascadia Mono", Consolas, monospace; color: var(--gold); }
  .bpurchase .bbuy { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--green); }
  .bpurchase.canbuy .gnext { color: var(--green); }

  #deathWrap { flex: 0 0 auto; border-bottom: 1px dashed rgba(224,93,111,.35); margin-bottom: 4px; padding-bottom: 6px; }
  .deathhead { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: .18em; color: #FF9A9A; text-transform: uppercase; }
  .deathhead i { font-size: 13px; }
  .deathhead .age { margin-left: auto; color: var(--dim); letter-spacing: .04em; text-transform: none; font-weight: 400; font-size: 10px; }
  #death { padding-top: 6px; display: flex; flex-direction: column; gap: 5px; }
  .crow.why .ctag { color: #FF8A8A; background: rgba(224,93,111,.14); }
  .crow.now .ctag { color: var(--amber); background: rgba(232,180,74,.12); }
  .crow.next .ctag { color: var(--blue); background: rgba(77,157,224,.12); }
  .chead.death { color: #FFB3B3; }
  .dloading { display: flex; align-items: center; gap: 8px; color: var(--dim); font-style: italic; padding: 4px 0; font-size: 13px; }
  .dloading i { animation: spin 1s linear infinite; font-size: 14px; color: #FF9A9A; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .slab {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-columns: minmax(0, 1.12fr) 1px minmax(0, 0.88fr); grid-template-rows: minmax(0, 1fr) auto;
    background: linear-gradient(180deg, #0C1626, #0A1220);
    border: 1px solid rgba(200,170,110,.16); border-radius: 14px; overflow: hidden;
  }
  .vdiv { background: linear-gradient(180deg, transparent, rgba(200,170,110,.26), transparent); }
  .pane { min-height: 0; display: flex; flex-direction: column; padding: 10px 16px 8px; }
  .ptitle { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 700; letter-spacing: .22em; color: var(--gold); text-transform: uppercase; }
  .ptitle i { font-size: 14px; }
  .ptitle .age { margin-left: auto; color: var(--dim); letter-spacing: .04em; text-transform: none; font-weight: 400; font-size: 10px; }
  .ptitle.blue, .pane.blue .ptitle { color: var(--blue); }
  .ptitle.red, .pane.red .ptitle { color: var(--red); }

  #coach { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-top: 7px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; align-content: start; }
  .chead { grid-column: 1 / -1; color: #B9C2D0; font-size: 12.5px; padding-bottom: 5px; border-bottom: 1px dashed rgba(255,255,255,.08); margin-bottom: 2px; }
  .crow { display: flex; gap: 8px; align-items: flex-start; }
  .ctag { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; font: 700 9.5px/1 "Cascadia Mono", Consolas, monospace; letter-spacing: .08em; padding: 4px 7px; border-radius: 6px; background: rgba(255,255,255,.05); white-space: nowrap; }
  .ctag i { font-size: 11px; }
  .ctext { font-size: 13px; line-height: 1.5; color: var(--text); }
  .crow.threat .ctag { color: #FF8A8A; background: rgba(224,93,111,.14); }
  .crow.build .ctag { color: var(--amber); background: rgba(232,180,74,.12); }
  .crow.map .ctag { color: var(--blue); background: rgba(77,157,224,.12); }
  .crow.avoid .ctag { color: #FF9E7A; background: rgba(255,158,122,.12); }
  .crow.ward .ctag { color: #C09CFF; background: rgba(192,156,255,.12); }
  .donow { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; margin-top: 3px; background: linear-gradient(90deg, rgba(200,170,110,.16), rgba(200,170,110,.03)); border: 1px solid rgba(200,170,110,.3); border-radius: 9px; padding: 8px 10px; }
  .donow .ctag { color: #131313; background: var(--gold); }
  .donow .ctext { font-weight: 600; font-size: 13.5px; }
  .coach-wait { grid-column: 1 / -1; color: var(--dim); font-style: italic; padding: 4px 0; }

  .teams { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
  .idlemsg { display: none; align-items: center; justify-content: center; height: 100%; color: var(--dim); font-size: 13.5px; text-align: center; }
  .idlemsg b { color: var(--gold); margin: 0 4px; }
  .tcol { min-height: 0; display: flex; flex-direction: column; padding: 10px 14px 8px; }
  .tcol.enemy { border-left: 1px solid rgba(255,255,255,.06); }
  .tlist { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-top: 6px; }

  .prow { position: relative; overflow: hidden; display: grid; grid-template-columns: 26px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 8px; margin-bottom: 3px; }
  .prow.me { background: rgba(200,170,110,.09); box-shadow: inset 0 0 0 1px rgba(200,170,110,.45); }
  .advbar { position: absolute; top: 0; bottom: 0; opacity: .16; pointer-events: none; }
  .advbar.ahead { left: 0; background: linear-gradient(90deg, rgba(79,203,124,.95), rgba(79,203,124,0)); }
  .advbar.behind { right: 0; background: linear-gradient(270deg, rgba(224,93,111,.95), rgba(224,93,111,0)); }
  .delta.plus { color: var(--green); }
  .delta.minus { color: var(--red); }
  .hl-champ { color: #7FD1FF; text-shadow: 0 0 8px rgba(127,209,255,.35); font-weight: 600; }
  .hl-obj { color: #F0C060; text-shadow: 0 0 8px rgba(240,192,96,.35); font-weight: 600; }
  .hl-item { color: #C9A0FF; text-shadow: 0 0 8px rgba(201,160,255,.35); font-weight: 600; }
  .prow img.champ { width: 26px; height: 26px; border-radius: 6px; display: block; background: #0a1220; }
  .pline { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .pname { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lvl { font: 700 9.5px/1 "Cascadia Mono", Consolas, monospace; color: var(--gold); background: rgba(200,170,110,.1); border-radius: 4px; padding: 2px 4px; }
  .pos { font-size: 8.5px; letter-spacing: .13em; color: var(--dim); text-transform: uppercase; }
  .you { background: var(--gold); color: #131313; font-size: 8.5px; font-weight: 700; padding: 1px 5px; border-radius: 4px; letter-spacing: .08em; }
  .items { display: flex; gap: 2px; margin-top: 3px; flex-wrap: nowrap; overflow: hidden; }
  .items img { width: 16px; height: 16px; border-radius: 3px; border: 1px solid rgba(255,255,255,.08); background: #0a1220; }
  .spells { display: flex; gap: 2px; margin-left: 2px; }
  .spells img { width: 15px; height: 15px; border-radius: 3px; opacity: .92; }
  .mextra { font-size: 9.5px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; }
  .kda { text-align: right; font: 600 12.5px/1.2 "Cascadia Mono", Consolas, monospace; white-space: nowrap; }
  .kda .k { color: var(--green); } .kda .d { color: var(--red); } .kda .a { color: var(--blue); }
  .kda .cs { display: block; font-size: 9.5px; color: var(--dim); font-weight: 400; margin-top: 2px; }
  .kda .gold { color: var(--gold); }

  .eventsline { grid-column: 1 / -1; display: flex; gap: 14px; white-space: nowrap; overflow: hidden; font-size: 11px; color: var(--dim); padding: 5px 16px 6px; border-top: 1px solid rgba(255,255,255,.06); mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); }
  .ev b { color: var(--gold); font-family: "Cascadia Mono", Consolas, monospace; font-weight: 600; margin-right: 5px; }

  @media (max-height: 880px) {
    body { padding: 6px 10px 7px; }
    .shell { gap: 5px; }
    #clock { font-size: 18px; }
    .bitem img { width: 20px; height: 20px; }
    .drow .ctext { font-size: 12.5px; }
    .pane { padding: 8px 12px 6px; }
    .ctext { font-size: 12.5px; }
    .prow { padding: 3px 5px; margin-bottom: 2px; }
    .prow img.champ { width: 23px; height: 23px; }
    .items img { width: 15px; height: 15px; }
    .spells img { width: 14px; height: 14px; }
    .eventsline { font-size: 10.5px; padding: 4px 14px 5px; }
  }

  @media (max-width: 1150px) {
    .slab { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) auto; }
    .vdiv { display: none; }
    #coach { max-height: 38vh; }
    .teams { height: 100%; }
  }

  @media (max-width: 720px) {
    html, body { height: auto; min-height: 100%; }
    body { overflow-y: auto; }
    .shell { height: auto; min-height: 100vh; }
    .slab { min-height: 70vh; }
    .topbar { gap: 10px; }
    #summoner { max-width: 45vw; }
    .teams { grid-template-columns: 1fr; }
    .tcol.enemy { border-left: none; border-top: 1px solid rgba(255,255,255,.06); }
    .eventsline { white-space: normal; flex-wrap: wrap; overflow: visible; mask-image: none; -webkit-mask-image: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div id="clock">--:--</div>
    <div class="livepill"><i class="ph-fill ph-broadcast st-wait" id="statIcon"></i><span id="statusText">connecting</span></div>
    <div class="obj" id="objDragon"><i class="ph-fill ph-fire"></i><span class="lab">DRG</span><span class="val" id="dragonVal">--:--</span></div>
    <div class="obj" id="objBaron"><i class="ph-fill ph-skull"></i><span class="lab">BRN</span><span class="val" id="baronVal">--:--</span></div>
    <div class="obj gold" id="objPhase"><i class="ph-fill ph-clock"></i><span class="val" id="phaseVal">—</span></div>
    <div class="tspacer"></div>
    <div id="summoner">—</div>
    <span class="diag" id="diag"></span>
    <div class="hcost"><span class="amount" id="costTotal">$—</span><span class="sub" id="costSub">—</span></div>
    <span class="audiostate off" id="audioState">audio off</span>
    <button class="mutebtn" id="muteBtn" title="toggle sound"><i class="ph-fill ph-speaker-high" id="muteIcon"></i></button>
  </div>

  <div class="buildstrip" id="buildStrip" style="display:none">
    <span class="blabel"><i class="ph-fill ph-hammer"></i>BUILD</span>
    <div class="bitems" id="buildItems"></div>
    <span class="bpurchase" id="buildPurchase" style="display:none"></span>
    <span class="berr" id="buildErr"></span>
  </div>

  <div class="slab">
    <div class="pane">
      <div class="ptitle"><i class="ph-fill ph-brain"></i>Coach readout <span class="age" id="coachAge"></span></div>
      <div id="deathWrap" style="display:none">
        <div class="deathhead"><i class="ph-fill ph-skull"></i>Death report
          <svg id="deathRing" width="15" height="15" viewBox="0 0 15 15" style="margin-left:2px"><circle cx="7.5" cy="7.5" r="6" fill="none" stroke="rgba(224,93,111,.25)" stroke-width="2"/><circle id="deathArc" cx="7.5" cy="7.5" r="6" fill="none" stroke="#E05D6F" stroke-width="2" stroke-dasharray="37.7" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 7.5 7.5)"/></svg>
          <span class="age" id="deathAge"></span></div>
        <div id="death"></div>
      </div>
      <div id="coach"><div class="coach-wait">Waiting for the first coach tick…</div></div>
    </div>
    <div class="vdiv"></div>
    <div class="pane" style="padding:0">
      <div class="idlemsg" id="idleMsg">Not in a game yet — queue up and this board comes alive.</div>
      <div class="teams">
        <div class="tcol">
          <div class="ptitle blue" id="teamTitle1"><i class="ph-fill ph-shield"></i>Your team</div>
          <div class="tlist" id="team1"></div>
        </div>
        <div class="tcol enemy">
          <div class="ptitle red" id="teamTitle2"><i class="ph-fill ph-sword"></i>Enemy team</div>
          <div class="tlist" id="team2"></div>
        </div>
      </div>
    </div>
    <div class="eventsline" id="events"></div>
  </div>
</div>

<script>
const FALLBACK_CDN_VERSION = '16.19.1';
const FRESH_WINDOW_MS = 6000;
const SPELL_ICONS = { Flash:'SummonerFlash', Ignite:'SummonerDot', Teleport:'SummonerTeleport', Smite:'SummonerSmite',
  Ghost:'SummonerHaste', Heal:'SummonerHeal', Exhaust:'SummonerExhaust', Barrier:'SummonerBarrier',
  Cleanse:'SummonerBoost', Snowball:'SummonerSnowball', Clarity:'SummonerMana' };
const POS = { MIDDLE:'MID', BOTTOM:'BOT', UTILITY:'SUP', JUNGLE:'JGL', TOP:'TOP', NONE:'' };

const COACH_TAGS = [
  ['THREAT', 'ph-warning-octagon', 'threat'],
  ['BUILD', 'ph-hammer', 'build'],
  ['MAP', 'ph-map-trifold', 'map'],
  ['AVOID', 'ph-prohibit', 'avoid'],
  ['WARD', 'ph-eye', 'ward']
];
const DEATH_TAGS = [
  ['WHY', 'ph-magnifying-glass', 'why'],
  ['NOW', 'ph-hourglass', 'now'],
  ['NEXT', 'ph-arrow-right', 'next']
];
const MOJIBAKE = [
  [/\u00d4\u00c7\u00f6/g, '\u2014'],
  [/\u00d4\u00c7\u00f4/g, '\u2013'],
  [/\u00d4\u00c7\u00d6/g, '\u2019'],
  [/\u00d4\u00c7\u00dc/g, '\u201c'],
  [/\u00d4\u00c7\u0153/g, '\u201d']
];

let cdnVersion = FALLBACK_CDN_VERSION;
let versionResolved = false;
let state = { inGame: false, status: 'connecting' };
let anchor = { t: 0, at: performance.now() };
let lastGoodAt = 0;
let gameSeq = 0;
let gameBusy = false;
let currentSession = null;
let lastPlanItems = [];
let lastPurchase = null;
let hlItems = [];
let KEYWORD_RE = null;
let KEYWORD_MAP = new Map();
let lastCoachText = null;
let deathAnchor = null;
let audioCtx = null;
let audioReady = false;
let soundOn = true;
const panelErrors = new Map();

const OBJECTIVES = ['dragon soul', 'elder dragon', 'rift herald', 'voidgrubs', 'rift scuttler', 'scuttle crab', 'blue buff', 'red buff', 'inhibitor', 'dragon', 'baron', 'herald', 'grubs', 'scuttle', 'elder', 'soul', 'turret', 'turrets', 'plates', 'raptors', 'wolves', 'gromp', 'krugs'];

const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const num = v => {
  if (typeof v === 'number' && isFinite(v)) return v;
  if (typeof v === 'string' && v.trim() !== '') { const n = Number(v); if (isFinite(n)) return n; }
  return null;
};
const numTxt = (v, d) => { const n = num(v); return n == null ? (d == null ? '\u2014' : d) : String(Math.round(n)); };
const validVersion = v => typeof v === 'string' && /^\d+\.\d+\.\d+$/.test(v);
const cdnUrl = p => 'https://ddragon.leagueoflegends.com/cdn/' + cdnVersion + p;
const safeId = v => {
  const n = num(v);
  return (n != null && Number.isInteger(n) && n > 0 && n < 100000000) ? n : null;
};
const safeChampKey = v => {
  const s = String(v == null ? '' : v).replace(/[^A-Za-z0-9_]/g, '');
  return s || 'Unknown';
};
const normalizeTeam = t => {
  const v = String(t == null ? '' : t).toUpperCase();
  return v === 'ORDER' || v === 'CHAOS' ? v : null;
};

function loadSoundPref(){
  try { return localStorage.getItem('lolcoachMute') !== '1'; } catch (e) { return true; }
}
soundOn = loadSoundPref();

function buildKeywords(){
  const champs = new Set();
  for (const p of [...(state.myTeam || []), ...(state.enemyTeam || []), ...(state.players || [])]) {
    if (isObj(p) && typeof p.champ === 'string' && p.champ) champs.add(p.champ);
  }
  const items = new Set([...hlItems, ...(lastPlanItems || []).map(i => isObj(i) ? i.name : '')]);
  const all = [
    ...[...champs].map(n => [n, 'hl-champ']),
    ...[...items].map(n => [n, 'hl-item']),
    ...OBJECTIVES.map(n => [n, 'hl-obj'])
  ].filter(pair => pair[0] && pair[0].length >= 3)
   .sort((a, b) => b[0].length - a[0].length);
  const map = new Map();
  const seen = new Set();
  const parts = [];
  for (const pair of all) {
    const low = pair[0].toLowerCase();
    if (seen.has(low)) continue;
    seen.add(low);
    map.set(low, pair[1]);
    parts.push(pair[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  }
  KEYWORD_MAP = map;
  if (!parts.length) { KEYWORD_RE = null; return; }
  try { KEYWORD_RE = new RegExp('\\b(?:' + parts.join('|') + ')\\b', 'gi'); } catch (e) { KEYWORD_RE = null; }
}

function highlight(raw){
  if (!KEYWORD_RE || !raw) return esc(raw);
  let out = '', last = 0, m;
  KEYWORD_RE.lastIndex = 0;
  while ((m = KEYWORD_RE.exec(raw))) {
    out += esc(raw.slice(last, m.index));
    const cls = KEYWORD_MAP.get(m[0].toLowerCase()) || '';
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  out += esc(raw.slice(last));
  return out;
}

function refreshAudioState(){
  audioReady = !!(soundOn && audioCtx && audioCtx.state === 'running');
  const icon = document.getElementById('muteIcon');
  const btn = document.getElementById('muteBtn');
  const st = document.getElementById('audioState');
  const state = !soundOn ? 'off' : (audioReady ? 'on' : (audioCtx ? 'blocked' : 'tap'));
  if (icon) icon.className = 'ph-fill ' + (!soundOn ? 'ph-speaker-slash' : (audioReady ? 'ph-speaker-high' : 'ph-speaker-low'));
  if (btn) {
    btn.classList.toggle('off', !soundOn);
    btn.title = state === 'off' ? 'sound off — click to enable'
      : (state === 'on' ? 'sound on — click to test/mute'
      : (state === 'blocked' ? 'sound on but blocked by browser — click to allow audio' : 'sound on — click to enable/test audio'));
  }
  if (st) {
    st.textContent = { off: 'audio off', on: 'audio on', blocked: 'audio blocked', tap: 'audio tap to enable' }[state];
    st.className = 'audiostate ' + state;
  }
}
function ensureAudio(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') {
      const p = audioCtx.resume();
      if (p && typeof p.then === 'function') p.then(refreshAudioState).catch(() => {});
    }
  } catch (e) { audioCtx = null; }
  refreshAudioState();
  return audioCtx;
}
function chime(kind){
  if (!soundOn) return false;
  const ctx = ensureAudio();
  if (!ctx || ctx.state !== 'running') return false;
  const t0 = ctx.currentTime + 0.01;
  const notes = kind === 'death' ? [[392, 0], [311.13, 0.16]] : [[880, 0], [1174.66, 0.11]];
  for (const pair of notes) {
    const f = pair[0], off = pair[1];
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = f;
    const start = t0 + off;
    const peak = kind === 'death' ? 0.22 : 0.14;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(peak, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + 0.45);
    o.connect(g); g.connect(ctx.destination);
    o.start(start); o.stop(start + 0.5);
  }
  return true;
}

function tidy(s){ let x = String(s ?? ''); for (const [re, rep] of MOJIBAKE) x = x.replace(re, rep); return x; }

async function fetchJson(url, timeoutMs){
  const ac = new AbortController();
  const to = setTimeout(() => { try { ac.abort(); } catch (e) {} }, timeoutMs || 8000);
  try {
    const r = await fetch(url, { cache: 'no-store', signal: ac.signal });
    let json = null, badJson = false;
    try { json = await r.json(); } catch (e) { badJson = true; }
    return { status: r.status, ok: r.ok, json: json, badJson: badJson };
  } finally { clearTimeout(to); }
}

function playerCard(p, opp){
  if (!isObj(p)) return '';
  const pos = POS[p.pos] ?? p.pos;
  const goldN = num(p.gold);
  const gold = goldN != null ? ` · <span class="gold" title="available gold">${Math.round(goldN)}g</span>` : '';
  let bar = '', deltaTxt = '', tip = '';
  if (isObj(opp)) {
    const pv = num(p.value), ov = num(opp.value);
    if (pv != null && ov != null) {
      const dv = pv - ov, ad = Math.abs(dv);
      if (ad >= 150) {
        const pct = Math.min(100, ad / 20);
        bar = `<span class="advbar ${dv > 0 ? 'ahead' : 'behind'}" style="width:${pct}%"></span>`;
        const v = ad >= 1000 ? (ad / 1000).toFixed(1) + 'k' : String(ad);
        deltaTxt = ` · <span class="delta ${dv > 0 ? 'plus' : 'minus'}">${dv > 0 ? '+' : '-'}${v}</span>`;
        const kind = p.valueKind === 'inventory_catalog_value' ? 'inventory catalog value' : 'item value';
        tip = ` title="${kind} vs ${esc(opp.champ)}: ${dv > 0 ? '+' : ''}${Math.round(dv)} (not total gold)"`;
      }
    }
  }
  let extra = '';
  if (p.me) {
    const a = isObj(p.abil) ? p.abil : {};
    extra = `<div class="mextra">Q${numTxt(a.Q)} W${numTxt(a.W)} E${numTxt(a.E)} R${numTxt(a.R)}${p.keystone ? ' · ' + esc(p.keystone) : ''}</div>`;
  }
  const key = safeChampKey(p.key || p.champ);
  return `<div class="prow${p.me ? ' me' : ''}"${tip}>${bar}
    <img class="champ" src="${cdnUrl('/img/champion/' + key + '.png')}" data-fallback="${cdnUrl('/img/champion/Unknown.png')}" title="${esc(p.champ)}" alt="">
    <div>
      <div class="pline"><span class="pname">${esc(p.champ)}</span><span class="lvl">${numTxt(p.level)}</span>${p.me ? '<span class="you">YOU</span>' : ''}<span class="pos">${esc(pos)}</span></div>
      ${itemImgs(p.items, p.spells)}
      ${extra}
    </div>
    <div class="kda"><span class="k">${numTxt(p.k, '–')}</span>/<span class="d">${numTxt(p.d, '–')}</span>/<span class="a">${numTxt(p.a, '–')}</span><span class="cs">${numTxt(p.cs, '–')} CS${gold}${deltaTxt}</span></div>
  </div>`;
}
function explicitSoul(s){
  let raw;
  if (typeof s.soulTeam === 'string') raw = s.soulTeam;
  else if (typeof s.soul === 'string') raw = s.soul;
  else if (isObj(s.soul) && (s.soul.team != null || s.soul.status != null)) raw = s.soul.team != null ? s.soul.team : s.soul.status;
  else if (typeof s.dragonSoul === 'string') raw = s.dragonSoul;
  else if (isObj(s.dragonSoul)) raw = s.dragonSoul.team != null ? s.dragonSoul.team : s.dragonSoul.status;
  if (raw === undefined || raw === null) return { present: false };
  const v = String(raw).toLowerCase();
  if (v === 'order' || v === 'chaos') return { present: true, team: v.toUpperCase() };
  if (v === 'none' || v === 'no_soul' || v === 'nosoul' || v === '') return { present: true, team: null };
  return { present: true, team: 'unknown' };
}

function dragonTiming(s){
  const kills = (Array.isArray(s.dragonKills) ? s.dragonKills : [])
    .filter(k => isObj(k) && num(k.t) != null)
    .map(k => ({ t: num(k.t), type: String(k.type || ''), team: normalizeTeam(k.team || k.killerTeam) }))
    .sort((a, b) => a.t - b.t);
  const elementals = kills.filter(k => k.type !== 'Elder');
  const allTeamsKnown = elementals.length > 0 && elementals.every(k => k.team);
  const counts = { ORDER: 0, CHAOS: 0, unknown: 0 };
  for (const k of elementals) { if (k.team) counts[k.team]++; else counts.unknown++; }
  const explicit = explicitSoul(s);
  let owner = null, soulKnown = false;
  if (explicit.present) {
    if (explicit.team === 'unknown') soulKnown = false;
    else { soulKnown = true; owner = explicit.team; }
  } else if (allTeamsKnown) {
    soulKnown = true;
    if (counts.ORDER >= 4) owner = 'ORDER';
    else if (counts.CHAOS >= 4) owner = 'CHAOS';
  }
  const last = kills.length ? kills[kills.length - 1] : null;
  const elderNext = !!(last && (last.type === 'Elder' || (soulKnown && owner)));
  const next = last ? last.t + (elderNext ? 360 : 300) : 300;
  let soulText, countsText = '';
  if (elementals.length) countsText = `drakes O${counts.ORDER} C${counts.CHAOS}` + (counts.unknown ? ` U${counts.unknown}` : '');
  if (!soulKnown) soulText = 'soul: unknown';
  else if (!owner) soulText = 'soul: none yet';
  else {
    const me = (Array.isArray(s.myTeam) ? s.myTeam : []).find(p => isObj(p) && p.me);
    const mySide = me ? normalizeTeam(me.team) : null;
    soulText = 'soul: ' + (mySide ? (owner === mySide ? 'your team' : 'enemy team') : owner);
  }
  return { next, total: kills.length, soulText, countsText, elderNext };
}

function renderPlan(items){
  const strip = document.getElementById('buildStrip');
  const errEl = document.getElementById('buildErr');
  if (!state.inGame) {
    lastPlanItems = [];
    strip.style.display = 'none';
    document.getElementById('buildItems').innerHTML = '';
    if (errEl) errEl.textContent = '';
    return;
  }
  lastPlanItems = (Array.isArray(items) ? items : [])
    .filter(it => isObj(it) && typeof it.name === 'string' && it.name.length <= 60);
  if (errEl) errEl.textContent = '';
  if (!lastPlanItems.length) { strip.style.display = 'none'; document.getElementById('buildItems').innerHTML = ''; return; }
  strip.style.display = 'flex';
  strip.title = 'Plan progress reflects current inventory only; sold items are not remembered';
  const me = [...(state.myTeam || []), ...(state.players || [])].find(x => isObj(x) && x.me);
  const inv = (me && Array.isArray(me.items)) ? me.items : [];
  const ownedIds = new Set();
  for (const i of inv) { const id = safeId(isObj(i) ? i.id : null); if (id != null) ownedIds.add(id); }
  const isDone = it => {
    const id = safeId(it.id);
    if (id == null) return false;
    if (ownedIds.has(id)) return true;
    if (Array.isArray(it.chain)) for (const c of it.chain) { const cid = safeId(c); if (cid != null && ownedIds.has(cid)) return true; }
    return false;
  };
  let html = '';
  const seen = new Set();
  for (const it of inv) {
    if (!isObj(it)) continue;
    const id = safeId(it.id);
    if (id == null || seen.has(id)) continue;
    seen.add(id);
    html += `<span class="bitem cur" title="${esc(it.n)}"><img src="${cdnUrl('/img/item/' + id + '.png')}" alt=""></span>`;
  }
  const pending = lastPlanItems.filter(it => !isDone(it));
  const caret = '<i class="ph-fill ph-caret-right barrow"></i>';
  html += caret;
  if (pending.length) {
    pending.forEach((it, i) => {
      if (i) html += caret;
      const next = i === 0;
      const id = safeId(it.id);
      const btitle = esc(it.name) + (next ? ' - next buy' : '');
      html += `<span class="bitem ${next ? 'next' : 'todo'}" data-btitle="${btitle}" title="${btitle}">`;
      if (id != null) html += `<img src="${cdnUrl('/img/item/' + id + '.png')}" alt="">`;
      else html += `<span style="font-size:9.5px;color:var(--dim);white-space:nowrap">${esc(it.name)}</span>`;
      html += '</span>';
    });
  } else {
    html += '<span class="bcomplete">plan complete</span>';
  }
  document.getElementById('buildItems').innerHTML = html;
  renderPurchase();
}

function renderPurchase(){
  const el = document.getElementById('buildPurchase');
  if (!el) return;
  const p = isObj(lastPurchase) ? lastPurchase : null;
  const next = (p && isObj(p.next)) ? p.next : null;
  const nextItem = document.querySelector('#buildItems .bitem.next');
  if (nextItem) nextItem.title = nextItem.getAttribute('data-btitle') || '';
  if (!state.inGame || !next) {
    el.style.display = 'none';
    el.innerHTML = '';
    el.title = '';
    el.classList.remove('canbuy');
    return;
  }
  const remaining = num(next.goldToComplete);
  const exact = next.costExact !== false;
  const goldNow = num(p.gold);
  const affordable = next.affordableNow === true;
  let costTxt;
  if (!exact || remaining == null) costTxt = 'cost unknown';
  else if (affordable) costTxt = Math.round(remaining) + 'g';
  else costTxt = Math.max(0, Math.round(remaining - (goldNow != null ? goldNow : 0))) + 'g to go';
  const comps = (Array.isArray(next.components) ? next.components : [])
    .filter(c => isObj(c) && c.affordable);
  const alts = (Array.isArray(p.alternatives) ? p.alternatives : []).filter(isObj);
  el.classList.toggle('canbuy', affordable);
  let html = '<span class="gnext">' + esc(costTxt) + '</span>';
  html += '<span>' + esc(typeof next.name === 'string' ? next.name : '') + '</span>';
  if (affordable) html += '<span class="bbuy">can afford now</span>';
  el.innerHTML = html;
  const tips = [];
  for (const c of comps.slice(0, 6)) tips.push('can buy ' + c.name + ' (' + numTxt(c.goldToComplete) + 'g)');
  for (const a of alts) tips.push('alternative: ' + a.name + ' (' + numTxt(a.goldToComplete) + 'g)');
  for (const r of (Array.isArray(p.reasons) ? p.reasons : [])) if (typeof r === 'string') tips.push(r);
  el.title = tips.join('\n');
  el.style.display = 'flex';
  if (nextItem) {
    const notes = [costTxt];
    if (affordable) notes.push('can afford now');
    if (comps.length) notes.push('can buy: ' + comps.map(c => c.name + ' (' + numTxt(c.goldToComplete) + 'g)').join(', '));
    const base = nextItem.getAttribute('data-btitle') || '';
    nextItem.title = base + (base ? ' — ' : '') + notes.join(' · ');
  }
}

function pickTeams(s){
  let mine = (Array.isArray(s.myTeam) ? s.myTeam : []).filter(isObj);
  let foe = (Array.isArray(s.enemyTeam) ? s.enemyTeam : []).filter(isObj);
  const identity = isObj(s.identity) ? s.identity : null;
  let resolved = identity ? identity.status === 'resolved' : false;
  if (mine.some(p => p.me)) resolved = true;
  if (!mine.length && !foe.length && Array.isArray(s.players)) {
    const players = s.players.filter(isObj);
    const meP = players.find(p => p.me);
    const mySide = meP ? normalizeTeam(meP.team) : null;
    if (mySide) {
      mine = players.filter(p => normalizeTeam(p.team) === mySide);
      foe = players.filter(p => normalizeTeam(p.team) !== mySide);
      return { mine, foe, resolved: true, mineLabel: 'Your team', foeLabel: 'Enemy team' };
    }
    const order = players.filter(p => normalizeTeam(p.team) === 'ORDER');
    const chaos = players.filter(p => normalizeTeam(p.team) === 'CHAOS');
    return { mine: order, foe: chaos, resolved: false, mineLabel: 'ORDER', foeLabel: 'CHAOS' };
  }
  if (!resolved) {
    const mineSide = mine.length ? normalizeTeam(mine[0].team) : null;
    const foeSide = foe.length ? normalizeTeam(foe[0].team) : null;
    return { mine, foe, resolved: false, mineLabel: mineSide || 'Team 1', foeLabel: foeSide || 'Team 2' };
  }
  return { mine, foe, resolved: true, mineLabel: 'Your team', foeLabel: 'Enemy team' };
}

function render(s){
  const teams = pickTeams(s);
  state = s;
  state.inGame = true;
  state.stale = false;
  document.getElementById('idleMsg').style.display = 'none';
  document.querySelector('.teams').style.display = 'grid';
  const all = [...teams.mine, ...teams.foe];
  const me = all.find(p => isObj(p) && p.me);
  document.getElementById('summoner').textContent = me ? (me.name || me.champ || '—') : (teams.resolved ? '—' : 'identity unresolved');
  document.getElementById('teamTitle1').textContent = teams.mineLabel;
  document.getElementById('teamTitle2').textContent = teams.foeLabel;
  buildKeywords();
  const mineByPos = {}, foeByPos = {};
  for (const p of teams.mine) if (p.pos && p.pos !== 'NONE') mineByPos[p.pos] = p;
  for (const p of teams.foe) if (p.pos && p.pos !== 'NONE') foeByPos[p.pos] = p;
  document.getElementById('team1').innerHTML = teams.mine.map(p => playerCard(p, foeByPos[p.pos])).join('');
  document.getElementById('team2').innerHTML = teams.foe.map(p => playerCard(p, mineByPos[p.pos])).join('');
  const t = num(s.time);
  document.getElementById('clock').textContent = t == null ? '--:--' : fmt(t);
  document.getElementById('clock').classList.remove('stale');
  renderTopbar(s, t);
  renderEvents(s.events);
  renderPlan(lastPlanItems);
  const mode = typeof s.mode === 'string' && s.mode ? s.mode : 'live';
  if (!teams.resolved) setStatus('wait', 'live · ' + mode + ' · identity unresolved');
  else setStatus('live', 'live · ' + mode);
}

function handleGame(j){
  if (!isObj(j)) { gameTrouble('UI server sent malformed data'); return; }
  if (!versionResolved && validVersion(j.assetVersion)) setCdnVersion(j.assetVersion);
  const status = typeof j.status === 'string' ? j.status : (j.inGame ? 'live' : 'no_game');
  if (status === 'live' && j.inGame) {
    panelOk('game');
    if (j.sessionId != null && j.sessionId !== currentSession) {
      currentSession = j.sessionId;
      document.getElementById('deathWrap').style.display = 'none';
      deathAnchor = null;
    }
    const t = num(j.time);
    if (t != null) anchor = { t: t, at: performance.now() };
    const fetched = num(j.fetchedAt);
    const transitMs = fetched != null ? Math.max(0, Math.min(60000, (Date.now() / 1000 - fetched) * 1000)) : 0;
    lastGoodAt = performance.now() - transitMs;
    render(j);
    return;
  }
  if (status === 'no_game') {
    panelOk('game');
    const why = typeof j.reason === 'string' && j.reason ? ' (' + j.reason.replace(/_/g, ' ') + ')' : '';
    renderIdle('no_game', 'Not in a game yet' + why + ' — queue up and this board comes alive.');
    setStatus('wait', 'not in a game');
    return;
  }
  if (status === 'api_error') {
    const why = typeof j.reason === 'string' ? j.reason : (typeof j.error === 'string' ? j.error : 'unknown');
    gameTrouble('Live Client API: ' + why, 'live client api error: ' + why);
    return;
  }
  gameTrouble('Unexpected game response from UI server');
}

async function pollGame(){
  if (gameBusy) return;
  gameBusy = true;
  const seq = ++gameSeq;
  try {
    const r = await fetchJson('/api/game', 8000);
    if (seq !== gameSeq) return;
    if (r.badJson || r.json == null) { gameTrouble('UI server sent malformed data'); return; }
    handleGame(r.json);
  } catch (e) {
    if (seq === gameSeq) gameTrouble(state.inGame ? 'UI server offline — showing stale board' : 'UI server offline');
  } finally { gameBusy = false; }
}
function renderCoach(j){
  if (!isObj(j)) return;
  const el = document.getElementById('coach');
  const age = num(j.age);
  document.getElementById('coachAge').textContent = age != null ? `${Math.round(age)}s ago` : '';
  const text = typeof j.text === 'string' ? j.text.trim() : '';
  if (text && text !== 'OUT OF GAME' && text !== lastCoachText) chime('tick');
  if (text) lastCoachText = text;
  if (!text) { el.innerHTML = '<div class="coach-wait">Waiting for the first coach tick…</div>'; return; }
  if (text === 'OUT OF GAME') { el.innerHTML = '<div class="coach-wait">Coach idle — not in a game.</div>'; return; }
  let html = '';
  for (const raw of text.split(/\r?\n/)) {
    const l = tidy(raw).trim();
    if (!l || l === '===COACH===') continue;
    let m;
    const tag = COACH_TAGS.find(t => (m = l.match(new RegExp('^[-\\u2022]\\s*' + t[0] + '\\s*:\\s*(.*)$', 'i'))));
    if (tag) {
      html += `<div class="crow ${tag[2]}"><span class="ctag"><i class="ph-fill ${tag[1]}"></i>${tag[0]}</span><span class="ctext">${highlight(m[1])}</span></div>`;
    } else if ((m = l.match(/^DO NOW\s*:\s*(.*)$/i))) {
      html += `<div class="donow"><span class="ctag"><i class="ph-fill ph-lightning"></i>DO NOW</span><span class="ctext">${highlight(m[1])}</span></div>`;
    } else {
      html += `<div class="chead">${highlight(l)}</div>`;
    }
  }
  el.innerHTML = html;
}

function renderDeath(j){
  if (!isObj(j)) return;
  const wrap = document.getElementById('deathWrap');
  const el = document.getElementById('death');
  const ring = document.getElementById('deathRing');
  const text = typeof j.text === 'string' ? j.text.trim() : '';
  const age = num(j.age);
  if (!text || age == null) { wrap.style.display = 'none'; deathAnchor = null; return; }
  const pend = text.match(/^PENDING\|([^|]+)\|(.+)$/);
  if (pend) {
    wrap.style.display = 'block';
    const isNew = !deathAnchor || deathAnchor.kind !== 'pending' || deathAnchor.clock !== pend[1] || deathAnchor.killer !== pend[2];
    if (isNew) chime('death');
    deathAnchor = { kind: 'pending', clock: pend[1], killer: pend[2], age: age, at: performance.now() };
    ring.style.display = 'none';
    document.getElementById('deathAge').textContent = 'analyzing';
    el.innerHTML = `<div class="chead death"><i class="ph-fill ph-skull"></i> Died ${highlight(pend[1])} to ${highlight(pend[2])} - generating report</div><div class="dloading"><i class="ph-fill ph-spinner-gap"></i>analyzing the death and your best options...</div>`;
    return;
  }
  if (age > 60) { wrap.style.display = 'none'; deathAnchor = null; return; }
  wrap.style.display = 'block';
  ring.style.display = '';
  deathAnchor = { kind: 'final', age: age, at: performance.now() };
  updateDeathRing();
  let html = '';
  for (const raw of text.split(/\r?\n/)) {
    const l = tidy(raw).trim();
    if (!l || l === '===DEATH===') continue;
    let m;
    if ((m = l.match(/^DIED\s*:\s*(.*)$/i))) {
      html += `<div class="chead death"><i class="ph-fill ph-skull"></i> Died ${highlight(m[1])}</div>`;
    } else if ((m = l.match(/^DO NOW\s*:\s*(.*)$/i))) {
      html += `<div class="donow"><span class="ctag"><i class="ph-fill ph-lightning"></i>DO NOW</span><span class="ctext">${highlight(m[1])}</span></div>`;
    } else {
      const tag = DEATH_TAGS.find(t => (m = l.match(new RegExp('^' + t[0] + '\\s*:\\s*(.*)$', 'i'))));
      if (tag) html += `<div class="crow ${tag[2]}"><span class="ctag"><i class="ph-fill ${tag[1]}"></i>${tag[0]}</span><span class="ctext">${highlight(m[1])}</span></div>`;
      else html += `<div class="chead death">${highlight(l)}</div>`;
    }
  }
  el.innerHTML = html;
}

function updateDeathRing(){
  const wrap = document.getElementById('deathWrap');
  if (!deathAnchor || deathAnchor.kind !== 'final' || wrap.style.display === 'none') return;
  if (state.inGame && lastGoodAt > 0 && performance.now() - lastGoodAt > FRESH_WINDOW_MS) return;
  const age = deathAnchor.age + (performance.now() - deathAnchor.at) / 1000;
  const arc = document.getElementById('deathArc');
  if (arc) arc.setAttribute('stroke-dashoffset', String(37.7 * Math.min(1, age / 60)));
  document.getElementById('deathAge').textContent = age < 8 ? 'just now' : `${Math.round(age)}s ago`;
  if (age > 60) { wrap.style.display = 'none'; deathAnchor = null; }
}

function markCoachAge(t){ const el = document.getElementById('coachAge'); if (el) el.textContent = t; }
function markDeathAge(t){
  const wrap = document.getElementById('deathWrap');
  const el = document.getElementById('deathAge');
  if (el && wrap && wrap.style.display !== 'none') el.textContent = t;
}

async function pollCoach(){
  try {
    const r = await fetchJson('/api/coach', 8000);
    const j = r.json;
    if (!isObj(j)) { panelFail('coach', 'malformed response'); markCoachAge('unavailable'); return; }
    renderCoach(j);
    if (j.status === 'error') { panelFail('coach', 'file read error'); markCoachAge('read error'); }
    else if (j.status === 'unstable') { panelFail('coach', 'unstable file read — retrying'); markCoachAge('unstable read'); }
    else { panelOk('coach'); }
  } catch (e) { panelFail('coach', 'UI server offline'); markCoachAge('server offline'); }
}

async function pollDeath(){
  try {
    const r = await fetchJson('/api/death', 8000);
    const j = r.json;
    if (!isObj(j)) { panelFail('death', 'malformed response'); markDeathAge('unavailable'); return; }
    renderDeath(j);
    if (j.status === 'error') { panelFail('death', 'file read error'); markDeathAge('read error'); }
    else if (j.status === 'unstable') { panelFail('death', 'unstable file read — retrying'); markDeathAge('unstable read'); }
    else { panelOk('death'); }
  } catch (e) { panelFail('death', 'UI server offline'); markDeathAge('server offline'); }
}

async function pollPlan(){
  try {
    const r = await fetchJson('/api/plan', 8000);
    const j = r.json;
    if (!isObj(j)) { panelFail('plan', 'malformed response'); showPlanError('plan unavailable'); return; }
    if (!versionResolved && validVersion(j.assetVersion)) setCdnVersion(j.assetVersion);
    if (j.status === 'read_error') { panelFail('plan', 'plan file read error'); showPlanError('plan read error'); return; }
    panelOk('plan');
    renderPlan(j.items);
  } catch (e) { panelFail('plan', 'UI server offline'); showPlanError('plan unavailable'); }
}

async function pollPurchase(){
  try {
    const r = await fetchJson('/api/purchase', 8000);
    if (r.status === 404) { lastPurchase = null; renderPurchase(); return; }
    const j = r.json;
    if (!isObj(j)) { panelFail('purchase', 'malformed response'); lastPurchase = null; renderPurchase(); return; }
    lastPurchase = j;
    if (j.ok || j.status === 'no_game' || j.status === 'no_identity') panelOk('purchase');
    else panelFail('purchase', typeof j.status === 'string' ? j.status : 'unavailable');
    renderPurchase();
  } catch (e) { lastPurchase = null; renderPurchase(); }
}

async function pollHighlight(){
  try {
    const r = await fetchJson('/api/highlight', 8000);
    const j = r.json;
    if (!isObj(j) || !Array.isArray(j.items)) { panelFail('highlight', 'malformed response'); return; }
    panelOk('highlight');
    hlItems = j.items.filter(n => typeof n === 'string' && n.length <= 60);
    buildKeywords();
  } catch (e) { panelFail('highlight', 'UI server offline'); }
}

async function pollCost(){
  try {
    const r = await fetchJson('/api/cost', 8000);
    const j = r.json;
    if (!isObj(j)) { panelFail('cost', 'malformed response'); setCost('$—', 'cost unavailable'); return; }
    if (!j.ok) {
      const st = typeof j.status === 'string' ? j.status : 'no_game';
      if (st === 'no_game') { panelOk('cost'); setCost('$—', 'no game'); return; }
      panelFail('cost', st + (typeof j.error === 'string' && j.error ? ': ' + j.error : ''));
      setCost('$—', 'cost unavailable (' + st + ')');
      return;
    }
    panelOk('cost');
    const cost = num(j.cost), last = num(j.lastTick), ticks = num(j.ticks);
    const total = cost != null ? '$' + cost.toFixed(4) : '$—';
    const bits = [];
    if (ticks != null) bits.push(`${ticks} tick${ticks === 1 ? '' : 's'}`);
    if (last != null) bits.push('last $' + last.toFixed(4));
    if (j.estimate || j.exact === false) bits.push('estimate');
    setCost(total, bits.join(' · ') || '—');
  } catch (e) { panelFail('cost', 'UI server offline'); setCost('$—', 'server offline'); }
}

async function pollVersion(){
  try {
    const r = await fetchJson('/api/version', 6000);
    const j = r.json;
    if (!isObj(j)) return;
    const canonical = validVersion(j.version) ? j.version : (validVersion(j.championVersion) ? j.championVersion : null);
    if (canonical) { versionResolved = true; setCdnVersion(canonical); }
    else if (!versionResolved && validVersion(j.assetVersion)) setCdnVersion(j.assetVersion);
  } catch (e) {}
}

function tickClock(){
  if (!state.inGame || num(state.time) == null) return;
  const now = performance.now();
  const age = lastGoodAt > 0 ? now - lastGoodAt : Infinity;
  const fresh = lastGoodAt > 0 && age <= FRESH_WINDOW_MS;
  const t = fresh ? anchor.t + (now - anchor.at) / 1000 : anchor.t;
  document.getElementById('clock').textContent = fresh ? fmt(t) : fmt(anchor.t);
  document.getElementById('clock').classList.toggle('stale', !fresh);
  renderTopbar(state, t);
  if (!fresh && !state.stale) {
    state.stale = true;
    setStatus('dead', 'stale — last update ' + Math.round(age / 1000) + 's ago');
  }
}

document.getElementById('muteBtn').addEventListener('click', async () => {
  soundOn = !soundOn;
  try { localStorage.setItem('lolcoachMute', soundOn ? '0' : '1'); } catch (e) {}
  if (soundOn) {
    const ctx = ensureAudio();
    if (ctx && ctx.state === 'suspended') { try { await ctx.resume(); } catch (e) {} }
    chime('tick');
  }
  refreshAudioState();
});
document.addEventListener('click', () => ensureAudio(), { once: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { ensureAudio(); refreshAudioState(); } });

function scheduleLoop(fn, ms){
  let stopped = false;
  async function step(){
    if (stopped) return;
    try { await fn(); } catch (e) {}
    if (!stopped) setTimeout(step, ms);
  }
  step();
}

refreshAudioState();
pollVersion();
scheduleLoop(pollGame, 2000);
scheduleLoop(pollCoach, 4000);
scheduleLoop(pollDeath, 4000);
scheduleLoop(pollCost, 5000);
scheduleLoop(pollPlan, 10000);
scheduleLoop(pollPurchase, 5000);
scheduleLoop(pollHighlight, 60000);
setInterval(updateDeathRing, 1000);
setInterval(tickClock, 250);
</script>
